# Project identification
sonar.projectKey=Test_01
sonar.projectName=SpringBootUIDemoProject
sonar.projectVersion=1.0

# Source code location
sonar.sources=src

# Location of compiled bytecode (after mvn clean install)
sonar.java.binaries=target/classes

# Optional: include test sources
sonar.tests=src/test/java

# Encoding of source files
sonar.sourceEncoding=UTF-8

# Exclusions (ignore generated files, build artifacts, etc.)
sonar.exclusions=**/target/**,**/*.test.java,**/generated/**

# Coverage reports (if you use JaCoCo for test coverage)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
